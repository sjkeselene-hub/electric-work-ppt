<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>标准电池电势 · 交互演示 · PowerPoint v2</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;

  }
  #viewport{position:relative;width:100%;height:100%;overflow:hidden;background:#eef4ff;}

  /* 主区 */
  .main { flex:1; display:grid; grid-template-columns:1.28fr .92fr; gap:26px; min-height:0; align-items:center; }

  /* ====== 电池图形 ====== */

           border:4px solid #0b57a4; box-shadow:inset 0 6px 18px rgba(11,87,164,.10);

  /* ====== 右侧信息区 ====== */

  .emf .lab { color:#d7e9ff; font-size:18px; line-height:1.3; flex-shrink:0; }

<body>
<div id="viewport"><div id="stage">
<div class="wrap">
  <div class="top">
    <h1>标准电池电势 · 交互演示</h1>
    <div class="hint">数据：25 ℃ 水溶液标准电极电势（以标准氢电极 SHE = 0.000 V 为基准）</div>
  </div>

  <div class="main">
    <!-- 电池图形 -->
    <div class="battery-zone">
      <div class="battery" id="battery">
        <div class="pole neg">−<b>负极</b></div>
        <div class="cap"></div>
        <div class="shell">
          <div class="plate neg"><span id="negPlateName">Zn</span></div>
          <div class="middle">
            <div class="lab">电解质溶液</div>
            <div class="ion" id="midIon">Zn<sup>2+</sup></div>
            <div class="name" id="midName">锌电极 · E° = −0.762 V</div>
          </div>
          <div class="plate pos"><span id="posPlateName">Cu</span></div>
        </div>
        <div class="cap pos"></div>
        <div class="pole pos">+<b>正极</b></div>
      </div>
      <div class="click-tip" id="clickTip">🖱 点击电池图形 → 打开对话框更换正负极</div>
    </div>

    <!-- 反应信息 -->
    <div class="panel">
      <div class="card">
        <div class="cap-row"><span class="tag neg">负极 · 氧化反应</span><span class="who" id="negWho">Zn</span></div>
        <div class="eq" id="negEq"></div>
      </div>
      <div class="card">
        <div class="cap-row"><span class="tag pos">正极 · 还原反应</span><span class="who" id="posWho">Cu</span></div>
        <div class="eq" id="posEq"></div>
      </div>
      <div class="card">
        <div class="cap-row"><span class="tag cell">电池总反应</span></div>
        <div class="eq" id="totalEq"></div>
      </div>
      <div class="emf">
        <div class="lab">电池电动势<br>E°<sub>cell</sub></div>
        <div class="val num" id="emfVal">1.104 <small>V</small></div>
        <div class="sub" id="emfSub"></div>
      </div>
      <div class="symbol" id="cellSymbol"></div>
    </div>
  </div>
  <div class="note">说明：5 号干电池（≈1.5 V）、镍氢电池（≈1.2 V）、锂离子电池（≈3.7 V）为非水或非标准体系，不能由标准电极电势直接计算，其电压为实际工作电压。</div>
</div>

<!-- ====== 更换电极对话框 ====== -->
<div class="mask" id="mask">
  <div class="dialog">
    <div class="dlg-head">
      <h3>更换电池正负极</h3>
      <div class="presets" id="presets"></div>
    </div>
    <div class="dlg-body">
      <div class="col">
        <div class="col-head neg">负极（氧化 · 电势较低者）</div>
        <div class="list" id="negList"></div>
      </div>
      <div class="col">
        <div class="col-head pos">正极（还原 · 电势较高者）</div>
        <div class="list" id="posList"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <div class="msg" id="dlgMsg"></div>
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="okBtn">确定</button>
    </div>
  </div>
</div>
</div></div>

<script>
/* LOGIC_START */
/* ================= 标准电极电势数据（25℃，水溶液，vs SHE） =================
   ox / red：还原方向的左、右两侧物种，[系数, 显示式]；n：电子数；E：标准电极电势(V) */
var ELECTRODES = [
  {id:"Li",   name:"Li<sup>+</sup>/Li",        E:-3.040, n:1, conductor:"Li",          solution:"Li<sup>+</sup>",
   ox:[[1,"Li<sup>+</sup>"]], red:[[1,"Li"]]},
  {id:"K",    name:"K<sup>+</sup>/K",          E:-2.931, n:1, conductor:"K",           solution:"K<sup>+</sup>",
   ox:[[1,"K<sup>+</sup>"]], red:[[1,"K"]]},
  {id:"Na",   name:"Na<sup>+</sup>/Na",        E:-2.710, n:1, conductor:"Na",          solution:"Na<sup>+</sup>",
   ox:[[1,"Na<sup>+</sup>"]], red:[[1,"Na"]]},
  {id:"Mg",   name:"Mg<sup>2+</sup>/Mg",       E:-2.372, n:2, conductor:"Mg",          solution:"Mg<sup>2+</sup>",
   ox:[[1,"Mg<sup>2+</sup>"]], red:[[1,"Mg"]]},
  {id:"Al",   name:"Al<sup>3+</sup>/Al",       E:-1.662, n:3, conductor:"Al",          solution:"Al<sup>3+</sup>",
   ox:[[1,"Al<sup>3+</sup>"]], red:[[1,"Al"]]},
  {id:"Zn",   name:"Zn<sup>2+</sup>/Zn",       E:-0.762, n:2, conductor:"Zn",          solution:"Zn<sup>2+</sup>",
   ox:[[1,"Zn<sup>2+</sup>"]], red:[[1,"Zn"]]},
  {id:"Fe",   name:"Fe<sup>2+</sup>/Fe",       E:-0.447, n:2, conductor:"Fe",          solution:"Fe<sup>2+</sup>",
   ox:[[1,"Fe<sup>2+</sup>"]], red:[[1,"Fe"]]},
  {id:"PbSO4-Pb", name:"PbSO<sub>4</sub>/Pb（硫酸）", E:-0.359, n:2, conductor:"Pb",  solution:"H<sub>2</sub>SO<sub>4</sub>", sys:"H2SO4",
   ox:[[1,"PbSO<sub>4</sub>"]], red:[[1,"Pb"],[1,"SO<sub>4</sub><sup>2-</sup>"]]},
  {id:"Ni",   name:"Ni<sup>2+</sup>/Ni",       E:-0.257, n:2, conductor:"Ni",          solution:"Ni<sup>2+</sup>",
   ox:[[1,"Ni<sup>2+</sup>"]], red:[[1,"Ni"]]},
  {id:"Pb",   name:"Pb<sup>2+</sup>/Pb",       E:-0.126, n:2, conductor:"Pb",          solution:"Pb<sup>2+</sup>",
   ox:[[1,"Pb<sup>2+</sup>"]], red:[[1,"Pb"]]},
  {id:"H2",   name:"2H<sup>+</sup>/H<sub>2</sub>（氢电极）", E:0.000, n:2, conductor:"Pt（H<sub>2</sub>）", solution:"H<sup>+</sup>",
   ox:[[2,"H<sup>+</sup>"]], red:[[1,"H<sub>2</sub>"]]},
  {id:"AgCl", name:"AgCl/Ag（银-氯化银）",     E:0.222,  n:1, conductor:"Ag",          solution:"Cl<sup>-</sup>",
   ox:[[1,"AgCl"]], red:[[1,"Ag"],[1,"Cl<sup>-</sup>"]]},
  {id:"Cu",   name:"Cu<sup>2+</sup>/Cu",       E:0.342,  n:2, conductor:"Cu",          solution:"Cu<sup>2+</sup>",
   ox:[[1,"Cu<sup>2+</sup>"]], red:[[1,"Cu"]]},
  {id:"I2",   name:"I<sub>2</sub>/I<sup>-</sup>", E:0.536, n:2, conductor:"Pt",        solution:"I<sup>-</sup>",
   ox:[[1,"I<sub>2</sub>"]], red:[[2,"I<sup>-</sup>"]]},
  {id:"Fe3",  name:"Fe<sup>3+</sup>/Fe<sup>2+</sup>", E:0.771, n:1, conductor:"Pt",    solution:"Fe<sup>3+</sup>/Fe<sup>2+</sup>",
   ox:[[1,"Fe<sup>3+</sup>"]], red:[[1,"Fe<sup>2+</sup>"]]},
  {id:"Ag",   name:"Ag<sup>+</sup>/Ag",        E:0.800,  n:1, conductor:"Ag",          solution:"Ag<sup>+</sup>",
   ox:[[1,"Ag<sup>+</sup>"]], red:[[1,"Ag"]]},
  {id:"Br2",  name:"Br<sub>2</sub>/Br<sup>-</sup>", E:1.066, n:2, conductor:"Pt",     solution:"Br<sup>-</sup>",
   ox:[[1,"Br<sub>2</sub>"]], red:[[2,"Br<sup>-</sup>"]]},
  {id:"O2",   name:"O<sub>2</sub>/H<sub>2</sub>O（氧电极）", E:1.229, n:4, conductor:"Pt（O<sub>2</sub>）", solution:"H<sup>+</sup>",
   ox:[[1,"O<sub>2</sub>"],[4,"H<sup>+</sup>"]], red:[[2,"H<sub>2</sub>O"]]},
  {id:"Cl2",  name:"Cl<sub>2</sub>/Cl<sup>-</sup>", E:1.358, n:2, conductor:"Pt",     solution:"Cl<sup>-</sup>",
   ox:[[1,"Cl<sub>2</sub>"]], red:[[2,"Cl<sup>-</sup>"]]},
  {id:"MnO4", name:"MnO<sub>4</sub><sup>-</sup>/Mn<sup>2+</sup>", E:1.507, n:5, conductor:"Pt", solution:"MnO<sub>4</sub><sup>-</sup>/Mn<sup>2+</sup>",
   ox:[[1,"MnO<sub>4</sub><sup>-</sup>"],[8,"H<sup>+</sup>"]], red:[[1,"Mn<sup>2+</sup>"],[4,"H<sub>2</sub>O"]]},
  {id:"PbO2", name:"PbO<sub>2</sub>/PbSO<sub>4</sub>（硫酸）", E:1.685, n:2, conductor:"PbO<sub>2</sub>", solution:"H<sub>2</sub>SO<sub>4</sub>", sys:"H2SO4",
   ox:[[1,"PbO<sub>2</sub>"],[1,"SO<sub>4</sub><sup>2-</sup>"],[4,"H<sup>+</sup>"]], red:[[1,"PbSO<sub>4</sub>"],[2,"H<sub>2</sub>O"]]},
  {id:"Ce4",  name:"Ce<sup>4+</sup>/Ce<sup>3+</sup>", E:1.720, n:1, conductor:"Pt",   solution:"Ce<sup>4+</sup>/Ce<sup>3+</sup>",
   ox:[[1,"Ce<sup>4+</sup>"]], red:[[1,"Ce<sup>3+</sup>"]]},
  {id:"F2",   name:"F<sub>2</sub>/F<sup>-</sup>", E:2.866, n:2, conductor:"Pt",        solution:"F<sup>-</sup>",
   ox:[[1,"F<sub>2</sub>"]], red:[[2,"F<sup>-</sup>"]]}
];

var PRESETS = [
  {name:"丹尼尔电池", neg:"Zn",       pos:"Cu"},
  {name:"氢氧燃料电池", neg:"H2",     pos:"O2"},
  {name:"锌银纽扣电池", neg:"Zn",     pos:"Ag"},
  {name:"铅蓄电池",   neg:"PbSO4-Pb", pos:"PbO2"}
];

var F_CONST = 96485; /* C/mol */

/* ================= 计算逻辑 ================= */
function gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
function coefStr(c){ return c===1 ? "" : String(c); }
function sideStr(list){
  return list.map(function(it){ return coefStr(it[0]) + it[1]; }).join(" + ");
}
/* 半反应：还原方向 */
function reductionStr(el){
  var e = (el.n===1 ? "e<sup>−</sup>" : el.n + "e<sup>−</sup>");
  return sideStr(el.ox) + " + " + e + " → " + sideStr(el.red);
}
/* 半反应：氧化方向（负极） */
function oxidationStr(el){
  var e = (el.n===1 ? "e<sup>−</sup>" : el.n + "e<sup>−</sup>");
  return sideStr(el.red) + " → " + sideStr(el.ox) + " + " + e;
}
/* 合并两侧同类项 */
function merge(list){
  var map = {}, order = [];
  list.forEach(function(it){
    if (map[it[1]] === undefined) { map[it[1]] = it[0]; order.push(it[1]); }
    else { map[it[1]] += it[0]; }
  });
  return order.map(function(k){ return [map[k], k]; });
}
/* 总反应：把正极还原半反应 ×k1，负极氧化半反应 ×k2，消去相同物种 */
function overallReaction(neg, pos){
  var g = gcd(neg.n, pos.n);
  var k1 = neg.n / g;   /* 正极系数：使两侧电子数相等 */
  var k2 = pos.n / g;   /* 负极系数 */
  var left  = merge(scale(pos.ox, k1).concat(scale(neg.red, k2)));
  var right = merge(scale(pos.red, k1).concat(scale(neg.ox, k2)));
  /* 两侧共同物种相减 */
  var keep = function(list, other){
    var om = {}; other.forEach(function(it){ om[it[1]] = it[0]; });
    var out = [];
    list.forEach(function(it){
      var c = it[0] - (om[it[1]] || 0);
      if (c > 0) out.push([c, it[1]]);
    });
    return out;
  };
  var L = keep(left, right), R = keep(right, left);
  /* 全部系数除以最大公约数 */
  var all = L.concat(R).map(function(it){ return it[0]; });
  var gg = all.reduce(function(a,b){ return gcd(a,b); }, all[0]);
  if (gg > 1) { L = L.map(function(it){ return [it[0]/gg, it[1]]; }); R = R.map(function(it){ return [it[0]/gg, it[1]]; }); }
  return { left:L, right:R, n: k1 * pos.n };
}
function scale(list, k){
  return list.map(function(it){ return [it[0]*k, it[1]]; });
}
/* 电池符号 */
function cellSymbol(neg, pos){
  return "(−) " + neg.conductor + " | " + neg.solution + " ‖ " + pos.solution + " | " + pos.conductor + " (+)";
}
function fmt(v, d){
  var s = Math.abs(v).toFixed(d);
  return (v < 0 ? "−" : "") + s;
}
/* 综合计算：给定两个电极 id，返回完整结果（自动判定正负极） */
function buildCell(negId, posId){
  var a = ELECTRODES.filter(function(e){ return e.id === negId; })[0];
  var b = ELECTRODES.filter(function(e){ return e.id === posId; })[0];
  if (!a || !b || a.id === b.id) return null;
  var swapped = false;
  var neg = a, pos = b;
  if (a.E > b.E) { neg = b; pos = a; swapped = true; }   /* 电势高者为正极 */
  var E = pos.E - neg.E;
  var r = overallReaction(neg, pos);
  return {
    neg: neg, pos: pos, swapped: swapped, E: E,
    negEq: oxidationStr(neg), posEq: reductionStr(pos),
    totalEq: sideStr(r.left) + " → " + sideStr(r.right),
    n: r.n, dG: -r.n * F_CONST * E / 1000,
    symbol: cellSymbol(neg, pos)
  };
}
/* LOGIC_END */
</script>

<script>

/* ================= PowerPoint / 浏览器整体缩放 ================= */
function fitStage(){
  var viewport=document.getElementById("viewport");
  var stage=document.getElementById("stage");
  if(!viewport || !stage) return;
  var baseW=1600, baseH=900;
  var vw=Math.max(1,viewport.clientWidth), vh=Math.max(1,viewport.clientHeight);
  var s=Math.min(vw/baseW,vh/baseH);
  var sw=baseW*s, sh=baseH*s;
  stage.style.transform="scale("+s+")";
  stage.style.left=((vw-sw)/2)+"px";
  stage.style.top=((vh-sh)/2)+"px";
}
window.addEventListener("resize",fitStage);
if(window.ResizeObserver){
  new ResizeObserver(fitStage).observe(document.getElementById("viewport"));
}

/* ================= 界面渲染 ================= */
var state = { neg:"Zn", pos:"Cu" };
var result = null;
var clickTipTimer = null;

function el(id){ return document.getElementById(id); }

function showAutoJudgeTip(){
  var tip = el("clickTip");
  if (!tip) return;
  if (clickTipTimer) clearTimeout(clickTipTimer);
  tip.innerHTML = "⚠ 已按电势高低自动判定正负极（电势较高者为正极）";
  clickTipTimer = setTimeout(function(){
    tip.innerHTML = "🖱 点击电池图形 → 打开对话框更换正负极";
    clickTipTimer = null;
  }, 3600);
}

function render(cell) {
  if (!cell) return;
  result = cell;
  el("negPlateName").innerHTML = cell.neg.conductor.replace(/（.*?）/g,"");
  el("posPlateName").innerHTML = cell.pos.conductor.replace(/（.*?）/g,"");
  el("midIon").innerHTML = cell.neg.solution + " ‖ " + cell.pos.solution;
  el("midName").innerHTML = cell.neg.name + "（E°=" + fmt(cell.neg.E,3) + " V）　|　"
                          + cell.pos.name + "（E°=" + fmt(cell.pos.E,3) + " V）";
  el("negWho").innerHTML = cell.neg.name;
  el("posWho").innerHTML = cell.pos.name;
  el("negEq").innerHTML = cell.negEq;
  el("posEq").innerHTML = cell.posEq;
  el("totalEq").innerHTML = cell.totalEq;
  el("emfVal").innerHTML = fmt(cell.E,3) + " <small>V</small>";
  el("emfSub").innerHTML = "n = " + cell.n + "　|　Δ<sub>r</sub>G°<sub>m</sub> = " + fmt(cell.dG,1) + " kJ·mol<sup>−1</sup>";
  el("cellSymbol").innerHTML = "电池符号：" + cell.symbol;
  state.neg = cell.neg.id; state.pos = cell.pos.id;
}

/* ---------- 对话框 ---------- */
var tmp = { neg:"Zn", pos:"Cu" };
function buildLists() {
  var negSorted = ELECTRODES.slice().sort(function(a,b){ return a.E - b.E; });
  var posSorted = ELECTRODES.slice().sort(function(a,b){ return b.E - a.E; });
  el("negList").innerHTML = negSorted.map(function(e){
    return '<div class="item' + (e.id===tmp.neg?" sel":"") + '" data-id="' + e.id + '"><span class="nm">'
      + e.name + '</span><span class="e">' + fmt(e.E,3) + ' V</span></div>';
  }).join("");
  el("posList").innerHTML = posSorted.map(function(e){
    return '<div class="item' + (e.id===tmp.pos?" sel":"") + '" data-id="' + e.id + '"><span class="nm">'
      + e.name + '</span><span class="e">' + fmt(e.E,3) + ' V</span></div>';
  }).join("");
  bindItems("negList", "neg");
  bindItems("posList", "pos");
}
function bindItems(listId, key) {
  Array.prototype.forEach.call(el(listId).querySelectorAll(".item"), function(node){
    node.onclick = function(){
      tmp[key] = node.getAttribute("data-id");
      buildLists();
      checkDlg();
    };
  });
}
function checkDlg() {
  var a = ELECTRODES.filter(function(e){ return e.id===tmp.neg; })[0];
  var b = ELECTRODES.filter(function(e){ return e.id===tmp.pos; })[0];
  if (tmp.neg === tmp.pos) { el("dlgMsg").innerHTML = "⚠ 正负极不能选择同一种电极材料"; return false; }
  var mix = (a.sys === "H2SO4") !== (b.sys === "H2SO4");
  el("dlgMsg").innerHTML = "当前选择：E° = " + fmt(b.E - a.E,3) + " V"
    + (a.E > b.E ? "（将自动交换正负极）" : "")
    + (mix ? "　·　提示：两电极介质不同（硫酸体系 / 一般水溶液），实际组装需统一电解质" : "");
  return true;
}
el("presets").innerHTML = PRESETS.map(function(p,i){
  return '<div class="chip" data-i="' + i + '">' + p.name + '</div>';
}).join("");
Array.prototype.forEach.call(el("presets").querySelectorAll(".chip"), function(node){
  node.onclick = function(){
    var p = PRESETS[parseInt(node.getAttribute("data-i"),10)];
    tmp.neg = p.neg; tmp.pos = p.pos;
    buildLists(); checkDlg();
  };
});

function openDlg() {
  tmp.neg = state.neg; tmp.pos = state.pos;
  el("dlgMsg").innerHTML = "";
  buildLists(); checkDlg();
  el("mask").classList.add("show");
}
function closeDlg(){ el("mask").classList.remove("show"); }

el("battery").onclick = openDlg;
el("clickTip").onclick = openDlg;
el("cancelBtn").onclick = closeDlg;
el("mask").onclick = function(e){ if (e.target === el("mask")) closeDlg(); };
el("okBtn").onclick = function(){
  if (tmp.neg === tmp.pos) { el("dlgMsg").innerHTML = "⚠ 正负极不能选择同一种电极材料"; return; }
  render(buildCell(tmp.neg, tmp.pos));
  closeDlg();
  showAutoJudgeTip();
};
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeDlg();
});

/* 启动 */
function initApp(){
  fitStage();
  render(buildCell(state.neg, state.pos));
}
if(window.Office && Office.onReady){
  Office.onReady(function(){ initApp(); });
}else{
  initApp();
}
setTimeout(fitStage,80);
</script>
</body>
</html>
