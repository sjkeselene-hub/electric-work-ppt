<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>电功公式演示 v7</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --blue:#4d73ef;--ink:#313846;--muted:#7d8591;--wire:#566172;
  --orange:#ee6b00;--bg:#f3f5fb;--card:#fff;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;padding:0;overflow:hidden;
  background:#f3f5fb;
  font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  color:var(--ink);
}
#viewport{
  position:relative;
  width:100%;height:100%;
  overflow:hidden;
  background:#f3f5fb;
}
.app{
  position:absolute;
  left:0;top:0;
  width:960px;height:540px;
  transform-origin:top left;
  display:grid;
  grid-template-rows:54px 212px 84px 48px 142px;
  background:linear-gradient(#fff,#f8f9fd);
  overflow:hidden;
}
.header{
  padding:8px 20px 7px;
  border-bottom:1px solid #e9ecf3;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.logo{font-size:15px;font-weight:800;color:#3f6ff0;line-height:1.05}
.logo span{color:#222;margin-left:4px}
.title{font-size:24px;font-weight:800;margin-top:3px;line-height:1}
.hint{font-size:12px;color:#87909c;text-align:right;white-space:nowrap}

.circuit-wrap{
  padding:2px 8px 0;
  overflow:hidden;
  display:flex;align-items:center;
}
svg{display:block;width:100%;height:100%}
.wire{fill:none;stroke:var(--wire);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.particle{fill:#4d73ef;filter:drop-shadow(0 0 8px rgba(77,115,239,.85))}
.top-i{font-size:34px;fill:#4d73ef}
.label{font-size:29px;fill:#48515f}
.batt-text{font-size:40px;font-weight:800;text-anchor:middle;fill:#fff}
.small-white{font-size:36px;font-weight:800;text-anchor:middle;fill:#fff}
.bulb-ray{stroke:#f1c16a;stroke-width:4;stroke-linecap:round;opacity:.5}
.tick{stroke:#4e5968;stroke-width:4;stroke-linecap:round}

.formula-area{
  padding:6px 52px 7px;
  display:grid;
  grid-template-rows:25px 18px 22px;
  align-content:start;
  row-gap:3px;
  overflow:hidden;
}
.energy-line{display:flex;align-items:end;justify-content:space-between;gap:10px}
.energy-title{font-size:16px;color:#4c5361;line-height:22px}
.energy-val{font-size:23px;font-weight:800;color:var(--orange);line-height:22px}
.bar{
  height:15px;
  border:2px solid #c7cdd8;border-radius:7px;background:#f5f6f9;
  overflow:hidden;padding:2px;margin:0;
}
.fill{height:100%;width:16.7%;background:linear-gradient(90deg,#ffad4a,#f16d09);border-radius:4px}
.time{font-size:15px;line-height:22px;margin:0;color:#3f4754;display:block;white-space:nowrap}

.formula{
  background:#f5f6fa;
  border-top:1px solid #eceef5;border-bottom:1px solid #eceef5;
  display:flex;align-items:center;justify-content:center;
  padding:0 12px;text-align:center;
  font-size:20px;color:#707784;white-space:nowrap;
  overflow:hidden;
}
.controls{
  padding:8px 24px 9px;
  background:#f8f9fd;
  display:grid;
  grid-template-rows:27px 27px 27px 38px;
  gap:2px;
  overflow:hidden;
}
.row{
  display:grid;grid-template-columns:118px 1fr 88px;
  align-items:center;gap:12px;
  min-width:0;
}
.row label,.val{font-size:14px;color:#777f8c;line-height:1;white-space:nowrap}
.val{text-align:right}
input[type=range]{
  width:100%;height:6px;border-radius:999px;appearance:none;outline:none;
  background:linear-gradient(to right,var(--blue) 0 var(--pct),#daddE5 var(--pct) 100%);
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:18px;height:18px;
  border-radius:50%;border:2px solid var(--blue);background:#fff;
  box-shadow:0 2px 7px rgba(63,92,162,.2);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;
  border-radius:50%;border:2px solid var(--blue);background:#fff;
  box-shadow:0 2px 7px rgba(63,92,162,.2);cursor:pointer;
}
.buttons{
  display:flex;gap:8px;justify-content:center;align-items:center;align-self:center;flex-wrap:nowrap;
}
button{
  border:0;border-radius:8px;background:#4d73ef;color:#fff;
  font-size:12px;font-weight:700;
  padding:6px 16px;cursor:pointer;
  box-shadow:0 4px 10px rgba(77,115,239,.14);
  line-height:1;
}
button.gray{background:#fff;color:#596170;border:1px solid #d9dee8}
</style>
</head>
<body>
<div id="viewport">
<div class="app">
  <div class="header">
    <div>
      <div class="logo">动态演示 <span>· 真理触手可及</span></div>
      <div class="title">电功公式演示</div>
    </div>
    <div class="hint">直接拖动 U、I、t 滑块</div>
  </div>

  <div class="circuit-wrap">
  <svg viewBox="0 0 1000 470" aria-label="电功公式演示电路">
    <defs>
      <linearGradient id="batt" x1="0" x2="1">
        <stop offset="0%" stop-color="#212933"/><stop offset="50%" stop-color="#3c4654"/><stop offset="100%" stop-color="#1e252f"/>
      </linearGradient>
      <radialGradient id="bulb" cx="45%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff8d6"/><stop offset="56%" stop-color="#ffd781"/><stop offset="100%" stop-color="#ffc057"/>
      </radialGradient>
      <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="17" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <path id="flowPath" d="M185,106 H812 V336 H184 V306"/>
    </defs>

    <path class="wire" d="M185 106 H812"/><path class="wire" d="M812 106 V145"/><path class="wire" d="M812 298 V336 H592"/>
    <path class="wire" d="M416 336 H185 V308"/><path class="wire" d="M185 106 V125"/>

    <g id="particles">
      <circle class="particle" r="8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#flowPath"/></animateMotion></circle>
      <circle class="particle" r="8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="-.44s"><mpath href="#flowPath"/></animateMotion></circle>
      <circle class="particle" r="8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="-.88s"><mpath href="#flowPath"/></animateMotion></circle>
      <circle class="particle" r="8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="-1.32s"><mpath href="#flowPath"/></animateMotion></circle>
      <circle class="particle" r="8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="-1.76s"><mpath href="#flowPath"/></animateMotion></circle>
    </g>

    <g transform="translate(122,125)">
      <rect x="0" y="0" width="128" height="188" rx="5" fill="url(#batt)" stroke="#222b36" stroke-width="4"/>
      <path d="M0,0 H128 V45 H0 Z" fill="#d63f41"/>
      <text x="64" y="34" class="small-white">+</text>
      <text id="batteryText" x="64" y="113" class="batt-text">220V</text>
      <text x="64" y="176" class="small-white">−</text>
      <rect x="55" y="-12" width="18" height="12" fill="#687384" rx="2"/><rect x="55" y="188" width="18" height="14" fill="#687384" rx="2"/>
    </g>

    <text id="topCurrent" x="505" y="81" class="top-i" text-anchor="middle">I = 1.0 A</text>

    <g id="rays" transform="translate(812,222)">
      <line class="bulb-ray" x1="0" y1="-104" x2="0" y2="-135"/><line class="bulb-ray" x1="74" y1="-74" x2="97" y2="-97"/>
      <line class="bulb-ray" x1="104" y1="0" x2="136" y2="0"/><line class="bulb-ray" x1="74" y1="74" x2="97" y2="97"/>
      <line class="bulb-ray" x1="-74" y1="-74" x2="-97" y2="-97"/><line class="bulb-ray" x1="-104" y1="0" x2="-136" y2="0"/>
      <line class="bulb-ray" x1="-74" y1="74" x2="-97" y2="97"/>
    </g>

    <g transform="translate(812,222)">
      <circle id="bulbGlow" cx="0" cy="0" r="84" fill="#ffd36a" opacity=".48" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="68" fill="url(#bulb)" stroke="#687386" stroke-width="5"/>
      <path d="M-26,-14 Q-7,-35 1,-3 Q10,-35 28,-14" fill="none" stroke="#ff6b1a" stroke-width="7" stroke-linecap="round"/>
      <line x1="-26" y1="-14" x2="-26" y2="30" stroke="#59606b" stroke-width="4"/><line x1="28" y1="-14" x2="28" y2="30" stroke="#59606b" stroke-width="4"/>
      <rect x="-38" y="68" width="76" height="23" rx="4" fill="#8d96a2"/><rect x="-34" y="91" width="68" height="13" rx="3" fill="#717b87"/><rect x="-27" y="104" width="54" height="13" rx="3" fill="#606a75"/>
    </g>
    <text id="powerText" x="812" y="394" class="label" text-anchor="middle">P = 220 W</text>

    <g transform="translate(505,336)">
      <circle cx="0" cy="0" r="65" fill="#fff" stroke="#4e5968" stroke-width="5"/>
      <line class="tick" x1="-43" y1="-30" x2="-55" y2="-39"/><line class="tick" x1="-28" y1="-44" x2="-34" y2="-57"/>
      <line class="tick" x1="-8" y1="-52" x2="-10" y2="-65"/><line class="tick" x1="14" y1="-50" x2="17" y2="-64"/>
      <line class="tick" x1="33" y1="-40" x2="42" y2="-52"/><line class="tick" x1="47" y1="-24" x2="60" y2="-31"/>
      <line id="needle" x1="0" y1="0" x2="0" y2="-48" stroke="#d34444" stroke-width="5" stroke-linecap="round"/>
      <text x="-48" y="-7" font-size="15" fill="#697383" text-anchor="middle">0</text>
      <text x="0" y="-56" font-size="15" fill="#697383" text-anchor="middle">2.5</text>
      <text x="48" y="-7" font-size="15" fill="#697383" text-anchor="middle">5</text>
      <circle cx="0" cy="0" r="6" fill="#4e5968"/><text x="0" y="44" font-size="32" font-weight="800" fill="#4e5968" text-anchor="middle">A</text>
    </g>
    <text id="meterText" x="505" y="440" class="label" text-anchor="middle">1.0 A</text>
  </svg>
  </div>

  <div class="formula-area">
    <div class="energy-line"><div class="energy-title">累计电功 W</div><div id="energyText" class="energy-val">2200 J</div></div>
    <div class="bar"><div id="fill" class="fill"></div></div><div id="timeText" class="time">t = 10 s</div>
  </div>

  <div id="formula" class="formula">W = UIt = 220 × 1.0 × 10 = 2200 J</div>

  <div class="controls">
    <div class="row"><label>U（电压）</label><input id="u" type="range" min="10" max="240" step="10" value="220"><div id="uVal" class="val">220 V</div></div>
    <div class="row"><label>I（电流）</label><input id="i" type="range" min="0.1" max="5" step="0.1" value="1.0"><div id="iVal" class="val">1.0 A</div></div>
    <div class="row"><label>t（时间）</label><input id="t" type="range" min="0" max="60" step="1" value="10"><div id="tVal" class="val">10 s</div></div>
    <div class="buttons"><button id="play" type="button">开始计时</button><button id="pause" type="button" class="gray">暂停</button><button id="reset" type="button" class="gray">重置</button></div>
  </div>
</div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id), u=$("u"), i=$("i"), t=$("t");
  const viewport=$("viewport"), app=document.querySelector(".app");
  function fitStage(){
    const baseW=960, baseH=540;
    const vw=Math.max(1,viewport.clientWidth), vh=Math.max(1,viewport.clientHeight);
    const s=Math.min(vw/baseW,vh/baseH);
    const scaledW=baseW*s, scaledH=baseH*s;
    app.style.transform="scale("+s+")";
    app.style.left=((vw-scaledW)/2)+"px";
    app.style.top=((vh-scaledH)/2)+"px";
  }
  window.addEventListener("resize",fitStage);
  if(window.ResizeObserver){new ResizeObserver(fitStage).observe(viewport);}
  let timer=null;
  function f1(x){return Number(x).toFixed(1)}
  function fmt(x){x=Number(x);return Math.abs(x-Math.round(x))<1e-8?String(Math.round(x)):x.toFixed(1)}
  function pct(el){const p=(Number(el.value)-Number(el.min))/(Number(el.max)-Number(el.min))*100;el.style.setProperty("--pct",p+"%")}
  function update(){
    const U=Number(u.value), I=Number(i.value), T=Number(t.value), P=U*I, W=P*T;
    $("uVal").textContent=fmt(U)+" V";$("iVal").textContent=f1(I)+" A";$("tVal").textContent=fmt(T)+" s";
    $("batteryText").textContent=fmt(U)+"V";$("topCurrent").textContent="I = "+f1(I)+" A";$("meterText").textContent=f1(I)+" A";
    $("powerText").textContent="P = "+fmt(P)+" W";$("energyText").textContent=fmt(W)+" J";$("timeText").textContent="t = "+fmt(T)+" s";
    $("formula").textContent="W = UIt = "+fmt(U)+" × "+f1(I)+" × "+fmt(T)+" = "+fmt(W)+" J";
    const maxW=Number(u.max)*Number(i.max)*Number(t.max);
    const workPct=maxW>0?Math.min(100,(W/maxW)*100):0;
    $("fill").style.width=workPct+"%";[u,i,t].forEach(pct);
    const brightness=Math.max(.18,Math.min(1,P/650));$("bulbGlow").setAttribute("opacity",(.10+.75*brightness).toFixed(2));$("rays").style.opacity=(.2+.8*brightness).toFixed(2);
    const currentRatio=Math.max(0,Math.min(1,(I-Number(i.min))/(Number(i.max)-Number(i.min))));
    // Ammeter sweep: 0.1 A -> left upper tick, midpoint -> vertical, 5.0 A -> right upper tick.
    const needleDeg=-140 + currentRatio*100;
    const needleRad=needleDeg*Math.PI/180;
    const needleLen=48;
    $("needle").setAttribute("x2",(needleLen*Math.cos(needleRad)).toFixed(2));
    $("needle").setAttribute("y2",(needleLen*Math.sin(needleRad)).toFixed(2));
    $("needle").removeAttribute("transform");
    const dur=Math.max(.65,3.6-Math.sqrt(I)*1.1);
    document.querySelectorAll("animateMotion").forEach((m,idx)=>{m.setAttribute("dur",dur.toFixed(2)+"s");m.setAttribute("begin",(-idx*dur/5).toFixed(2)+"s")});
  }
  function stop(){if(timer){clearInterval(timer);timer=null}}
  $("play").addEventListener("click",()=>{stop();timer=setInterval(()=>{const n=Number(t.value)+1;if(n>Number(t.max)){stop();return}t.value=n;update()},1000)});
  $("pause").addEventListener("click",stop);
  $("reset").addEventListener("click",()=>{stop();u.value=220;i.value=1.0;t.value=10;update()});
  [u,i,t].forEach(el=>el.addEventListener("input",update));
  if(window.Office && Office.onReady){Office.onReady(()=>{fitStage();update()})} else {fitStage();update()}
  setTimeout(fitStage,80);
})();
</script>
</body>
</html>
